<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a2b"/>
      <stop offset="60%" stop-color="#07101a"/>
      <stop offset="100%" stop-color="#04080e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83a9d8"/>
      <stop offset="100%" stop-color="#4b86d8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#4b86d8" stroke-width="12" stroke-opacity="0.32"/>
  <!-- Logo Monogram 'mD' -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="240" letter-spacing="-14">
    <tspan fill="#f2f5f8">m</tspan><tspan fill="url(#blueGrad)">D</tspan>
  </text>
</svg>
